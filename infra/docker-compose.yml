name: ai-recruitment-agent-team

services:
  mysql:
    image: mysql:8.4
    container_name: ai-recruitment-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_recruitment}
      MYSQL_USER: ${MYSQL_USER:-ai_recruitment}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: ai-recruitment-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        else
          redis-server --appendonly yes
        fi
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: ai-recruitment-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ETCD_PORT:-2379}:2379"
    volumes:
      - ./data/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ai-recruitment-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: ${TZ:-Asia/Shanghai}
    command: server /data --console-address ":9001"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: ai-recruitment-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MILVUS_GRPC_PORT:-19530}:19530"
      - "${BIND_ADDRESS:-127.0.0.1}:${MILVUS_HTTP_PORT:-9091}:9091"
    volumes:
      - ./data/milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  rag-service:
    build:
      context: ../rag-service
    container_name: ai-recruitment-rag-service
    restart: unless-stopped
    environment:
      RAG_STORAGE_BACKEND: ${RAG_STORAGE_BACKEND:-milvus}
      MILVUS_HOST: milvus
      MILVUS_GRPC_PORT: 19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-recruitment_knowledge_chunks}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-128}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-700}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-120}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RAG_SERVICE_PORT:-8200}:8200"
    depends_on:
      milvus:
        condition: service_healthy

  python-agent-runtime:
    build:
      context: ../python-agent-runtime
    container_name: ai-recruitment-python-agent-runtime
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-30}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PYTHON_AGENT_RUNTIME_PORT:-8100}:8100"

  java-backend:
    build:
      context: ../java-backend
    container_name: ai-recruitment-java-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_recruitment}
      MYSQL_USERNAME: ${MYSQL_USER:-ai_recruitment}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AGENT_RUNTIME_BASE_URL: http://python-agent-runtime:8100
      RAG_SERVICE_BASE_URL: http://rag-service:8200
      RESUME_STORAGE_DIR: /app/data/resumes
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${JAVA_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./data/resumes:/app/data/resumes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-service:
        condition: service_started
      python-agent-runtime:
        condition: service_started

  frontend-admin:
    build:
      context: ../frontend/admin
    container_name: ai-recruitment-frontend-admin
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_ADMIN_PORT:-3000}:80"
    depends_on:
      java-backend:
        condition: service_started

networks:
  default:
    name: ai-recruitment-network
